<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng Ký</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-3">📝 Đăng Ký Tài Khoản</h3>
        {% if thong_bao %}<div class="alert alert-success py-1 small">{{ thong_bao }}</div>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">Tài khoản mới</label><input type="text" name="username" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" name="password" class="form-control" required></div>
            <button type="submit" class="btn btn-success w-100 mb-2">Đăng Ký</button>
        </form>
        <a href="/dang-nhap/" class="text-center d-block small mb-2">Đã có tài khoản? Đăng nhập</a>
        <a href="/" class="text-center d-block text-decoration-none small">&larr; Về trang chủ</a>
    </div>
</body>
</html>
