<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chọn Combo Bắp Nước</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 550px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">🍿 Chọn Combo Bắp & Nước</h3>
            <p class="text-muted text-center small">Ghế đang giữ: <strong>{{ booking.ds_ghe|join:", " }}</strong></p>

            <form method="POST" onsubmit="return xacNhanCombo();">
                {% csrf_token %}
                <div class="list-group mb-4">
                    <label class="list-group-item d-flex gap-3 align-items-center">
                        <input class="form-check-input flex-shrink-0" type="radio" name="combo" value="khong|0|Không mua Combo" checked>
                        <span>
                            <strong>Không mua Combo</strong>
                            <small class="d-block text-muted">0đ</small>
                        </span>
                    </label>
                    <label class="list-group-item d-flex gap-3 align-items-center">
                        <input class="form-check-input flex-shrink-0" type="radio" name="combo" value="cb1|60000|Combo 1 (1 Bắp + 1 Nước)">
                        <span>
                            <strong>🍿🥤 Combo 1: 1 Bắp + 1 Nước</strong>
                            <small class="d-block text-success fw-bold">60,000đ</small>
                        </span>
                    </label>
                    <label class="list-group-item d-flex gap-3 align-items-center">
                        <input class="form-check-input flex-shrink-0" type="radio" name="combo" value="cb2|80000|Combo 2 (1 Bắp + 2 Nước)">
                        <span>
                            <strong>🍿🥤🥤 Combo 2: 1 Bắp + 2 Nước</strong>
                            <small class="d-block text-success fw-bold">80,000đ</small>
                        </span>
                    </label>
                    <label class="list-group-item d-flex gap-3 align-items-center">
                        <input class="form-check-input flex-shrink-0" type="radio" name="combo" value="cb3|110000|Combo Gia Đình (2 Bắp + 2 Nước)">
                        <span>
                            <strong>🍿🍿🥤🥤 Combo Gia Đình: 2 Bắp + 2 Nước</strong>
                            <small class="d-block text-success fw-bold">110,000đ</small>
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Tiếp Tục &rarr;</button>
            </form>
        </div>
    </div>

    <script>
        function xacNhanCombo() {
            const selected = document.querySelector('input[name="combo"]:checked').value.split("|");
            return confirm("Xác nhận lựa chọn: " + selected[2] + " (" + Number(selected[1]).toLocaleString() + "đ)?");
        }
    </script>
</body>
</html>
